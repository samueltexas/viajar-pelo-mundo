spring:
  application:
    name: viajar-pelo-mundo-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/viajarpelomundo}
    username: ${DB_USERNAME:viajarpelomundo}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
