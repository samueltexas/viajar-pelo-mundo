services:
  postgres:
    image: postgres:17-alpine
    container_name: viajarpelomundo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: viajarpelomundo
      POSTGRES_USER: viajarpelomundo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U viajarpelomundo -d viajarpelomundo
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
