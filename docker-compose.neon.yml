services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: ${NEON_DB_URL:?Required}
      DB_USERNAME: ${NEON_DB_USERNAME:?Required}
      DB_PASSWORD: ${NEON_DB_PASSWORD:?Required}
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:8090:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8091:80"
    depends_on:
      - backend
    restart: unless-stopped
